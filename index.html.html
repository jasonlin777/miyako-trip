<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>宮古島環島紀行｜2026.10.7-10.11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sea-deep:#0A3D4A;
  --sea:#0C6478;
  --sea-bright:#12AFC4;
  --sand:#FBF6EA;
  --sand-card:#FFFFFF;
  --coral:#FF6F59;
  --sun:#FFB238;
  --ink:#15323D;
  --ink-soft:#5C7A83;
  --line:#E4DFD0;
  --radius:18px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--sand);
  color:var(--ink);
  font-family:'Noto Sans TC',sans-serif;
  display:flex;
  justify-content:center;
  min-height:100%;
  overscroll-behavior-y:none;
}
#app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  background:var(--sand);
  position:relative;
  display:flex;
  flex-direction:column;
}

/* ===== Header ===== */
header{
  background:linear-gradient(160deg,var(--sea-deep) 0%,var(--sea) 100%);
  color:#fff;
  padding:22px 20px 18px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 6px 18px rgba(10,61,74,.18);
}
.eyebrow{
  font-family:'Roboto Mono',monospace;
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--sun);
  display:flex;
  align-items:center;
  gap:8px;
}
.eyebrow::before{content:"";width:14px;height:1px;background:var(--sun);display:inline-block;}
h1{
  font-family:'Noto Serif TC',serif;
  font-weight:900;
  font-size:26px;
  line-height:1.25;
  margin-top:6px;
  letter-spacing:.02em;
}
.subline{
  font-size:12.5px;
  color:rgba(255,255,255,.72);
  margin-top:6px;
  font-family:'Roboto Mono',monospace;
}

/* route map signature element */
.routewrap{margin-top:16px;}
.routesvg{width:100%;height:auto;display:block;}
.routesvg .path{fill:none;stroke:rgba(255,255,255,.28);stroke-width:2;stroke-dasharray:3 7;stroke-linecap:round;}
.routesvg .node{cursor:pointer;}
.routesvg .node circle{fill:var(--sea-deep);stroke:rgba(255,255,255,.5);stroke-width:1.5;transition:all .25s ease;}
.routesvg .node text{fill:rgba(255,255,255,.65);font-family:'Roboto Mono',monospace;font-size:9px;text-anchor:middle;}
.routesvg .node.active circle{fill:var(--coral);stroke:#fff;r:11;}
.routesvg .node.active text{fill:#fff;font-weight:700;}
.routesvg .node:not(.active):hover circle{fill:var(--sea-bright);}

/* ===== Day pill selector ===== */
.daypills{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:14px 20px 4px;
  scrollbar-width:none;
}
.daypills::-webkit-scrollbar{display:none;}
.pill{
  flex:0 0 auto;
  font-family:'Roboto Mono',monospace;
  font-size:12px;
  font-weight:500;
  padding:8px 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink-soft);
  white-space:nowrap;
  cursor:pointer;
  transition:all .2s ease;
}
.pill.active{
  background:var(--sea-deep);
  border-color:var(--sea-deep);
  color:#fff;
}

/* ===== Main content ===== */
main{
  flex:1;
  padding:16px 20px calc(96px + var(--safe-bottom));
}
.view{display:none;animation:fade .25s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.daytitle{
  font-family:'Noto Serif TC',serif;
  font-weight:700;
  font-size:19px;
  margin:4px 0 2px;
}
.daydate{
  font-family:'Roboto Mono',monospace;
  font-size:12px;
  color:var(--ink-soft);
  margin-bottom:16px;
}

/* timeline */
.timeline{position:relative;padding-left:22px;}
.timeline::before{
  content:"";
  position:absolute;
  left:5px;top:6px;bottom:6px;
  width:1.5px;
  background:var(--line);
}
.item{position:relative;padding-bottom:18px;}
.item:last-child{padding-bottom:0;}
.dot{
  position:absolute;left:-22px;top:4px;
  width:11px;height:11px;border-radius:50%;
  background:var(--sea-bright);
  border:2px solid var(--sand);
  box-shadow:0 0 0 1.5px var(--sea-bright);
}
.item.meal .dot{background:var(--coral);box-shadow:0 0 0 1.5px var(--coral);}
.item.flight .dot{background:var(--sun);box-shadow:0 0 0 1.5px var(--sun);}
.card{
  background:var(--sand-card);
  border-radius:var(--radius);
  padding:14px 16px;
  border:1px solid var(--line);
}
.time{
  font-family:'Roboto Mono',monospace;
  font-size:11.5px;
  color:var(--sea);
  font-weight:700;
  letter-spacing:.03em;
}
.place{
  font-size:15.5px;
  font-weight:700;
  margin-top:3px;
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}
.badge{
  font-family:'Roboto Mono',monospace;
  font-size:10px;
  font-weight:700;
  padding:2px 7px;
  border-radius:999px;
  background:rgba(255,111,89,.12);
  color:var(--coral);
  white-space:nowrap;
}
.note{
  font-size:13px;
  color:var(--ink-soft);
  line-height:1.55;
  margin-top:5px;
}
.warn{
  font-size:12px;
  color:#B5590A;
  background:rgba(255,178,56,.15);
  border-radius:10px;
  padding:6px 10px;
  margin-top:8px;
  line-height:1.5;
}
.maprow{
  display:flex;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap;
}
.mapbtn{
  font-family:'Noto Sans TC',sans-serif;
  font-size:12.5px;
  font-weight:700;
  color:var(--sea-deep);
  background:rgba(12,100,120,.08);
  border:1px solid rgba(12,100,120,.18);
  border-radius:10px;
  padding:7px 12px;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:5px;
  transition:background .15s ease;
}
.mapbtn:active{background:rgba(12,100,120,.18);}
.mapbtn svg{width:13px;height:13px;flex:0 0 auto;}

/* candidate list */
.candbox{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;}
.candlabel{
  font-family:'Roboto Mono',monospace;
  font-size:10.5px;
  color:var(--ink-soft);
  margin-bottom:6px;
}
.cand{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  padding:6px 0;
  border-bottom:1px solid var(--line);
  gap:10px;
}
.cand:last-child{border-bottom:none;}
.candname{font-size:13px;font-weight:700;}
.candmeta{font-size:11.5px;color:var(--ink-soft);text-align:right;flex:0 0 auto;}

/* section title generic */
.sectitle{
  font-family:'Noto Serif TC',serif;
  font-weight:700;
  font-size:18px;
  margin:22px 0 10px;
}
.sectitle:first-child{margin-top:4px;}

/* generic info card */
.infocard{
  background:var(--sand-card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
}
.infocard h3{
  font-size:15px;
  font-weight:700;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:6px;
}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13.5px;border-bottom:1px solid #F0ECE0;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--ink-soft);flex:0 0 auto;}
.kv .v{font-weight:600;text-align:right;}
.flightcard{
  background:linear-gradient(135deg,var(--sea-deep),var(--sea));
  color:#fff;
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
}
.flightcard .flabel{font-family:'Roboto Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:var(--sun);text-transform:uppercase;}
.flightrow{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
.fpoint{text-align:center;}
.fcode{font-family:'Roboto Mono',monospace;font-size:22px;font-weight:700;}
.ftime{font-family:'Roboto Mono',monospace;font-size:13px;color:rgba(255,255,255,.8);margin-top:2px;}
.fline{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 10px;}
.fline .lbl{font-size:10.5px;color:rgba(255,255,255,.65);margin-bottom:4px;}
.fline .bar{width:100%;height:1px;background:rgba(255,255,255,.35);position:relative;}
.fline .bar::after{content:"✈";position:absolute;right:0;top:-8px;font-size:12px;}

/* packing checklist */
.checkgroup{margin-bottom:16px;}
.checkgroup h4{font-size:13.5px;font-weight:700;color:var(--sea-deep);margin-bottom:8px;}
.checkitem{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid #F0ECE0;
  font-size:13.5px;
  cursor:pointer;
  user-select:none;
}
.checkitem:last-child{border-bottom:none;}
.box{
  width:19px;height:19px;flex:0 0 auto;
  border-radius:6px;
  border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  transition:all .15s ease;
}
.box svg{width:12px;height:12px;opacity:0;transform:scale(.6);transition:all .15s ease;}
.checkitem.done .box{background:var(--sea);border-color:var(--sea);}
.checkitem.done .box svg{opacity:1;transform:scale(1);}
.checkitem.done span.label{color:var(--ink-soft);text-decoration:line-through;}

/* budget table */
.budgetrow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #F0ECE0;
}
.budgetrow:last-child{border-bottom:none;}
.budgetrow .blab{font-size:13.5px;font-weight:600;}
.budgetrow .bday{font-size:11px;color:var(--ink-soft);font-family:'Roboto Mono',monospace;}
.budgetrow .bval{font-family:'Roboto Mono',monospace;font-weight:700;color:var(--sea-deep);font-size:14px;}
.budgettotal{
  margin-top:6px;
  padding-top:14px;
  border-top:2px solid var(--sea-deep);
  display:flex;justify-content:space-between;align-items:baseline;
}
.budgettotal .blab{font-family:'Noto Serif TC',serif;font-weight:700;font-size:16px;}
.budgettotal .bval{font-family:'Roboto Mono',monospace;font-weight:900;font-size:22px;color:var(--coral);}

/* ===== Bottom nav ===== */
nav.bottomnav{
  position:fixed;
  bottom:0;left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  display:flex;
  padding:8px 6px calc(8px + var(--safe-bottom));
  z-index:30;
}
.navbtn{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  background:none;
  border:none;
  padding:6px 2px;
  color:var(--ink-soft);
  font-family:'Noto Sans TC',sans-serif;
  font-size:10.5px;
  cursor:pointer;
  border-radius:12px;
  transition:color .15s ease;
}
.navbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;}
.navbtn.active{color:var(--coral);}
.navbtn.active svg{stroke:var(--coral);}

::selection{background:var(--sun);color:var(--sea-deep);}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="eyebrow">Miyakojima Island Loop</div>
    <h1>宮古島環島紀行</h1>
    <div class="subline">2026.10.07 — 10.11 ｜ 6人・純自駕 ｜ Delica D:5</div>
    <div class="routewrap">
      <svg class="routesvg" viewBox="0 0 440 90" id="routeSvg">
        <path class="path" d="M30,55 C70,15 120,15 150,45 C175,70 210,70 230,45 C255,15 300,15 330,45 C355,68 390,60 410,35"/>
      </svg>
    </div>
    <div class="daypills" id="dayPills"></div>
  </header>

  <main>
    <!-- 行程 -->
    <section class="view active" id="view-itinerary"></section>
    <!-- 交通 -->
    <section class="view" id="view-transport"></section>
    <!-- 住宿 -->
    <section class="view" id="view-stay"></section>

    <section class="view" id="view-packing"></section>
    <!-- 預算 -->
    <section class="view" id="view-budget"></section>
  </main>

  <nav class="bottomnav" id="bottomNav"></nav>
</div>

/* ============ HELPERS ============ */
const mapURL = q => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;

function itemHTML(it){
  const cls = ["item", it.type==="meal"?"meal":"", it.type==="flight"?"flight":""].join(" ").trim();
  let cand = "";
  if(it.cand){
    cand = `<div class="candbox"><div class="candlabel">候選清單</div>${it.cand.map(c=>`<div class="cand"><div class="candname">${c.n}</div><div class="candmeta">${c.m}</div></div>`).join("")}</div>`;
  }
  return `<div class="${cls}">
    <div class="dot"></div>
    <div class="card">
      <div class="time">${it.t}</div>
      <div class="place">${it.place}${it.badge?`<span class="badge">${it.badge}</span>`:""}${it.tag?`<span class="badge">${it.tag}</span>`:""}</div>
      ${it.note?`<div class="note">${it.note}</div>`:""}
      ${it.warn?`<div class="warn">${it.warn}</div>`:""}
      ${it.map?`<div class="maprow"><a class="mapbtn" href="${mapURL(it.map)}" target="_blank" rel="noopener">${ICONS.pin}導航</a></div>`:""}
      ${cand}
    </div>
  </div>`;
}

/* ============ RENDER: ITINERARY ============ */
let activeDay = 1;

function renderRouteSvg(){
  const svg = document.getElementById("routeSvg");
  const coords = [[30,55],[125,25],[220,50],[315,25],[410,35]];
  const old = svg.querySelectorAll(".node");
  old.forEach(n=>n.remove());
  coords.forEach((c,i)=>{
    const g = document.createElementNS("http://www.w3.org/2000/svg","g");
    g.setAttribute("class","node"+(activeDay===i+1?" active":""));
    g.innerHTML = `<circle cx="${c[0]}" cy="${c[1]}" r="9"></circle><text x="${c[0]}" y="${c[1]+23}">D${i+1}</text>`;
    g.addEventListener("click",()=>{activeDay=i+1;renderAll();document.getElementById("nav-itinerary").click();});
    svg.appendChild(g);
  });
}

function renderDayPills(){
  const wrap = document.getElementById("dayPills");
  wrap.innerHTML = DAYS.map(d=>`<div class="pill${d.id===activeDay?" active":""}" data-day="${d.id}">${d.label} ${d.date}</div>`).join("");
  wrap.querySelectorAll(".pill").forEach(p=>{
    p.addEventListener("click",()=>{activeDay=parseInt(p.dataset.day);renderAll();});
  });
}

function renderItineraryView(){
  const day = DAYS.find(d=>d.id===activeDay);
  const el = document.getElementById("view-itinerary");
  el.innerHTML = `
    <div class="daytitle">${day.label}｜${day.title}</div>
    <div class="daydate">${day.date}</div>
    <div class="timeline">${day.items.map(itemHTML).join("")}</div>
  `;
}

/* ============ NAV ============ */
const NAV_ITEMS = [

  {id:"transport",label:"交通",icon:ICONS.car},
  {id:"stay",label:"住宿",icon:ICONS.bed},
  {id:"packing",label:"行李",icon:ICONS.bag},
  {id:"budget",label:"預算",icon:ICONS.coin}
];

function renderNav(){
  const nav = document.getElementById("bottomNav");
  nav.innerHTML = NAV_ITEMS.map((n,i)=>`
    <button class="navbtn${i===0?" active":""}" id="nav-${n.id}" data-target="${n.id}">
      ${n.icon}<span>${n.label}</span>
    </button>
  `).join("");
  nav.querySelectorAll(".navbtn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      nav.querySelectorAll(".navbtn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
      document.getElementById("view-"+btn.dataset.target).classList.add("active");
      document.querySelector("main").scrollTo?.(0,0);
      window.scrollTo(0,0);
    });
  });
}

renderNav();
