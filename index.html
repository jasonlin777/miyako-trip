<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#00A896">
<title>宮古島自由行｜2026.10.7-10.11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;800&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --ocean-1:#00A8E8;
  --ocean-2:#00A896;
  --ocean-3:#028090;
  --ocean-deep:#023E4D;
  --sand:#F6F2E9;
  --glass:rgba(255,255,255,.66);
  --glass-strong:rgba(255,255,255,.86);
  --glass-border:rgba(255,255,255,.55);
  --gold:#F4A261;
  --coral:#E76F51;
  --text:#1D2A44;
  --text-soft:rgba(29,42,68,.6);
  --line:rgba(29,42,68,.10);
  --radius:22px;
  --radius-sm:14px;
  --shadow:0 10px 30px rgba(2,62,77,.08);
  --shadow-lift:0 18px 40px rgba(2,62,77,.16);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{height:100%;background:var(--sand);}
body{
  min-height:100%;
  background:
    radial-gradient(circle at 12% 6%, rgba(0,168,232,.14), transparent 42%),
    radial-gradient(circle at 92% 18%, rgba(244,162,97,.14), transparent 38%),
    radial-gradient(circle at 20% 90%, rgba(0,168,150,.10), transparent 40%),
    var(--sand);
  background-attachment:fixed;
  color:var(--text);
  font-family:'Plus Jakarta Sans','Noto Sans TC',sans-serif;
  letter-spacing:.02em;
  line-height:1.7;
  display:flex;
  justify-content:center;
  min-height:100%;
  overscroll-behavior-y:none;
}
#app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  position:relative;
  display:flex;
  flex-direction:column;
}

/* ===== Header ===== */
header{
  background:linear-gradient(165deg,var(--ocean-1) 0%,var(--ocean-2) 55%,var(--ocean-3) 100%);
  color:#fff;
  padding:14px 20px 0;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 8px 26px rgba(2,62,77,.22);
}
header::before{
  content:"";
  position:absolute;inset:0;
  background:
    radial-gradient(circle at 78% 10%, rgba(255,255,255,.30), transparent 34%),
    radial-gradient(circle at 15% 60%, rgba(255,255,255,.14), transparent 40%),
    radial-gradient(circle at 60% 85%, rgba(255,255,255,.10), transparent 45%);
  pointer-events:none;
  animation:shimmer 9s ease-in-out infinite alternate;
}
@keyframes shimmer{
  from{opacity:.7;transform:translateY(0);}
  to{opacity:1;transform:translateY(4px);}
}
header > *{position:relative;z-index:1;padding-left:0;padding-right:0;}
.headerpad{padding:0 0 18px;}
.eyebrow{
  font-family:'Roboto Mono',monospace;
  font-size:9.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#FFE4BE;
  display:flex;
  align-items:center;
  gap:7px;
}
.eyebrow::before{content:"☀";font-size:11px;}
h1{
  font-family:'Plus Jakarta Sans','Noto Sans TC',sans-serif;
  font-weight:800;
  font-size:19px;
  line-height:1.25;
  margin-top:3px;
  letter-spacing:.01em;
}
.subline{
  font-size:10.5px;
  color:rgba(255,255,255,.82);
  margin-top:4px;
  font-family:'Roboto Mono',monospace;
  letter-spacing:.02em;
}

/* route map signature element */
.routewrap{margin-top:8px;}
.routesvg{width:100%;height:auto;display:block;}
.routesvg .path{fill:none;stroke:rgba(255,255,255,.35);stroke-width:2;stroke-dasharray:3 7;stroke-linecap:round;}
.routesvg .node{cursor:pointer;}
.routesvg .node circle{fill:rgba(255,255,255,.18);stroke:rgba(255,255,255,.7);stroke-width:1.5;transition:all .3s ease;}
.routesvg .node text{fill:rgba(255,255,255,.75);font-family:'Roboto Mono',monospace;font-size:9px;text-anchor:middle;}
.routesvg .node.active circle{fill:var(--gold);stroke:#fff;r:11;}
.routesvg .node.active text{fill:#fff;font-weight:700;}
.routesvg .node:not(.active):hover circle{fill:rgba(255,255,255,.34);}

/* wave divider */
.wavedivider{display:block;width:auto;height:18px;margin:6px -20px 0;position:relative;z-index:1;}
.wavedivider path{fill:var(--sand);}

/* ===== Day pill selector ===== */
.daypills{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:9px 20px 9px;
  margin:0 -20px;
  scrollbar-width:none;
  background:var(--sand);
}
.daypills::-webkit-scrollbar{display:none;}
.pill{
  flex:0 0 auto;
  font-family:'Roboto Mono',monospace;
  font-size:11px;
  font-weight:600;
  padding:7px 12px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--glass-strong);
  backdrop-filter:blur(8px);
  color:var(--text-soft);
  white-space:nowrap;
  cursor:pointer;
  transition:all .3s ease;
  box-shadow:0 2px 8px rgba(2,62,77,.05);
}
.pill:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
.pill.active{
  background:linear-gradient(135deg,var(--ocean-2),var(--ocean-3));
  border-color:transparent;
  color:#fff;
  box-shadow:0 8px 20px rgba(2,128,144,.32);
}

/* ===== Main content ===== */
main{
  flex:1;
  padding:18px 20px calc(100px + var(--safe-bottom));
}
.view{display:none;animation:fade .3s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.daytitle{
  font-family:'Plus Jakarta Sans','Noto Sans TC',sans-serif;
  font-weight:800;
  font-size:19px;
  margin:4px 0 2px;
  color:var(--ocean-3);
}
.daydate{
  font-family:'Roboto Mono',monospace;
  font-size:12px;
  color:var(--text-soft);
  margin-bottom:18px;
  letter-spacing:.05em;
}

/* timeline */
.timeline{position:relative;padding-left:24px;}
.timeline::before{
  content:"";
  position:absolute;
  left:6px;top:6px;bottom:6px;
  width:2px;
  background:linear-gradient(180deg,var(--ocean-1),var(--gold));
  opacity:.35;
  border-radius:2px;
}
.item{position:relative;padding-bottom:20px;}
.item:last-child{padding-bottom:0;}
.dot{
  position:absolute;left:-24px;top:6px;
  width:12px;height:12px;border-radius:50%;
  background:var(--ocean-2);
  border:2.5px solid var(--sand);
  box-shadow:0 0 0 1.5px var(--ocean-2);
}
.item.meal .dot{background:var(--coral);box-shadow:0 0 0 1.5px var(--coral);}
.item.flight .dot{background:var(--gold);box-shadow:0 0 0 1.5px var(--gold);}
.card{
  background:var(--glass);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-radius:var(--radius);
  padding:16px 18px;
  border:1px solid var(--glass-border);
  box-shadow:var(--shadow);
  transition:transform .3s ease,box-shadow .3s ease;
}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift);}
.time{
  font-family:'Roboto Mono',monospace;
  font-size:11.5px;
  color:var(--ocean-3);
  font-weight:700;
  letter-spacing:.04em;
}
.icon-badge{
  width:28px;height:28px;flex:0 0 auto;
  border-radius:50%;
  background:linear-gradient(160deg,var(--ocean-2),var(--ocean-3));
  display:flex;align-items:center;justify-content:center;
  margin-right:2px;
  box-shadow:0 4px 10px rgba(2,128,144,.28);
}
.icon-badge svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:1.8;}
.item.meal .icon-badge{background:linear-gradient(160deg,var(--coral),var(--gold));box-shadow:0 4px 10px rgba(231,111,81,.3);}
.item.flight .icon-badge{background:linear-gradient(160deg,var(--gold),#ffd08a);box-shadow:0 4px 10px rgba(244,162,97,.3);}
.item.flight .icon-badge svg{stroke:var(--ocean-deep);}
.place{
  font-size:15.5px;
  font-weight:700;
  margin-top:4px;
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  letter-spacing:.01em;
}
.badge{
  font-family:'Roboto Mono',monospace;
  font-size:10px;
  font-weight:700;
  padding:3px 9px;
  border-radius:999px;
  background:rgba(231,111,81,.14);
  color:var(--coral);
  white-space:nowrap;
  letter-spacing:.03em;
}
.note{
  font-size:13px;
  color:var(--text-soft);
  line-height:1.7;
  margin-top:6px;
}
.warn{
  font-size:12px;
  color:#9a5a10;
  background:rgba(244,162,97,.18);
  border-radius:var(--radius-sm);
  padding:8px 12px;
  margin-top:9px;
  line-height:1.6;
}
.maprow{
  display:flex;
  gap:8px;
  margin-top:11px;
  flex-wrap:wrap;
}
.mapbtn{
  font-family:'Plus Jakarta Sans','Noto Sans TC',sans-serif;
  font-size:12.5px;
  font-weight:700;
  color:#fff;
  background:linear-gradient(135deg,var(--ocean-2),var(--ocean-3));
  border:none;
  border-radius:var(--radius-sm);
  padding:8px 14px;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:5px;
  transition:transform .25s ease,box-shadow .25s ease;
  box-shadow:0 6px 14px rgba(2,128,144,.24);
}
.mapbtn:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(2,128,144,.32);}
.mapbtn:active{transform:translateY(-1px);}
.mapbtn svg{width:13px;height:13px;flex:0 0 auto;}

/* candidate list */
.candbox{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;}
.candlabel{
  font-family:'Roboto Mono',monospace;
  font-size:10.5px;
  color:var(--text-soft);
  margin-bottom:8px;
  letter-spacing:.05em;
}
.cand{
  padding:10px 12px;
  border-radius:var(--radius-sm);
  margin-bottom:6px;
  background:rgba(255,255,255,.45);
  transition:background .25s ease,transform .25s ease;
}
.cand:hover{background:rgba(255,255,255,.7);transform:translateY(-2px);}
.cand:last-child{margin-bottom:0;}
.candname{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;}
.candmeta{font-size:12px;color:var(--text-soft);margin-top:3px;line-height:1.6;}
.cand .maprow{margin-top:8px;}

/* section title generic */
.sectitle{
  font-family:'Plus Jakarta Sans','Noto Sans TC',sans-serif;
  font-weight:800;
  font-size:18px;
  margin:24px 0 12px;
  color:var(--ocean-3);
}
.sectitle:first-child{margin-top:4px;}

/* generic info card */
.infocard{
  background:var(--glass);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--glass-border);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
  transition:transform .3s ease,box-shadow .3s ease;
}
.infocard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);}
.infocard h3{
  font-size:15px;
  font-weight:800;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--ocean-3);
}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:13.5px;border-bottom:1px solid rgba(29,42,68,.08);}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--text-soft);flex:0 0 auto;}
.kv .v{font-weight:600;text-align:right;}
.flightcard{
  background:linear-gradient(135deg,var(--ocean-2),var(--ocean-3));
  color:#fff;
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 14px 28px rgba(2,128,144,.24);
  transition:transform .3s ease;
}
.flightcard:hover{transform:translateY(-3px);}
.flightcard .flabel{font-family:'Roboto Mono',monospace;font-size:10.5px;letter-spacing:.12em;color:#FFE4BE;text-transform:uppercase;}
.flightrow{display:flex;align-items:center;justify-content:space-between;margin-top:12px;}
.fpoint{text-align:center;}
.fcode{font-family:'Roboto Mono',monospace;font-size:22px;font-weight:700;}
.ftime{font-family:'Roboto Mono',monospace;font-size:13px;color:rgba(255,255,255,.85);margin-top:2px;}
.fline{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 10px;}
.fline .lbl{font-size:10.5px;color:rgba(255,255,255,.7);margin-bottom:4px;}
.fline .bar{width:100%;height:1px;background:rgba(255,255,255,.4);position:relative;}
.fline .bar::after{content:"✈";position:absolute;right:0;top:-8px;font-size:12px;}

/* packing checklist */
.checkgroup{margin-bottom:18px;}
.checkgroup h4{font-size:13.5px;font-weight:800;color:var(--ocean-3);margin-bottom:9px;}
.checkitem{
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 2px;
  border-bottom:1px solid rgba(29,42,68,.08);
  font-size:13.5px;
  cursor:pointer;
  user-select:none;
  transition:transform .2s ease;
}
.checkitem:hover{transform:translateX(2px);}
.checkitem:last-child{border-bottom:none;}
.box{
  width:20px;height:20px;flex:0 0 auto;
  border-radius:7px;
  border:1.5px solid var(--line);
  background:rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;
  transition:all .2s ease;
}
.box svg{width:12px;height:12px;opacity:0;transform:scale(.6);transition:all .2s ease;}
.checkitem.done .box{background:linear-gradient(135deg,var(--ocean-2),var(--ocean-3));border-color:transparent;}
.checkitem.done .box svg{opacity:1;transform:scale(1);}
.checkitem.done span.label{color:var(--text-soft);text-decoration:line-through;}

/* budget table */
.budgetrow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:11px 0;
  border-bottom:1px solid rgba(29,42,68,.08);
}
.budgetrow:last-child{border-bottom:none;}
.budgetrow .blab{font-size:13.5px;font-weight:600;}
.budgetrow .bday{font-size:11px;color:var(--text-soft);font-family:'Roboto Mono',monospace;}
.budgetrow .bval{font-family:'Roboto Mono',monospace;font-weight:700;color:var(--ocean-3);font-size:14px;}
.budgettotal{
  margin-top:8px;
  padding-top:16px;
  border-top:2px solid var(--ocean-2);
  display:flex;justify-content:space-between;align-items:baseline;
}
.budgettotal .blab{font-family:'Plus Jakarta Sans','Noto Sans TC',sans-serif;font-weight:800;font-size:16px;}
.budgettotal .bval{font-family:'Roboto Mono',monospace;font-weight:900;font-size:23px;color:var(--coral);}

/* ===== Bottom nav ===== */
nav.bottomnav{
  position:fixed;
  bottom:0;left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  background:var(--glass-strong);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--glass-border);
  border-radius:24px 24px 0 0;
  display:flex;
  padding:10px 6px calc(10px + var(--safe-bottom));
  z-index:30;
  box-shadow:0 -8px 26px rgba(2,62,77,.10);
}
.navbtn{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  background:none;
  border:none;
  padding:7px 2px;
  color:var(--text-soft);
  font-family:'Plus Jakarta Sans','Noto Sans TC',sans-serif;
  font-size:10.5px;
  font-weight:600;
  cursor:pointer;
  border-radius:14px;
  transition:all .25s ease;
}
.navbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;transition:transform .25s ease;}
.navbtn:hover{transform:translateY(-3px);}
.navbtn.active{color:var(--coral);background:rgba(231,111,81,.10);}
.navbtn.active svg{stroke:var(--coral);transform:translateY(-1px);}

::selection{background:var(--gold);color:var(--ocean-deep);}
</style>

</head>
<body>
<div id="app">

  <header>
    <div class="eyebrow">Miyako Island  Travel</div>
    <h1>宮古島自由行</h1>
    <div class="subline">2026.10.07 — 10.11 ｜ 6人・自駕旅遊 ｜ Delica D:5</div>
    <div class="routewrap">
      <svg class="routesvg" viewBox="0 0 440 58" id="routeSvg">
        <path class="path" d="M30,33 C70,9 120,9 150,27 C175,42 210,42 230,27 C255,9 300,9 330,27 C355,41 390,36 410,21"/>
      </svg>
    </div>
    <svg class="wavedivider" viewBox="0 0 480 18" preserveAspectRatio="none"><path d="M0,8 C80,17 160,1 240,8 C320,15 400,1 480,9 L480,18 L0,18 Z"/></svg>
    <div class="daypills" id="dayPills"></div>
  </header>

  <main>
    <!-- 行程 -->
    <section class="view active" id="view-itinerary"></section>
    <!-- 交通 -->
    <section class="view" id="view-transport"></section>
    <!-- 住宿 -->
    <section class="view" id="view-stay"></section>
    <!-- 行李 -->
    <section class="view" id="view-packing"></section>
    <!-- 預算 -->
    <section class="view" id="view-budget"></section>
  </main>

  <nav class="bottomnav" id="bottomNav"></nav>
</div>

<script>
/* ============ ICONS ============ */
const ICONS = {
  cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  car:'<svg viewBox="0 0 24 24"><path d="M3 13l1.5-5A2 2 0 0 1 6.4 6.5h11.2A2 2 0 0 1 19.5 8l1.5 5"/><rect x="2.5" y="13" width="19" height="6" rx="1.5"/><circle cx="7" cy="19" r="1.6"/><circle cx="17" cy="19" r="1.6"/></svg>',
  bed:'<svg viewBox="0 0 24 24"><path d="M3 18v-7a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v7"/><path d="M13 11h6a2 2 0 0 1 2 2v5"/><path d="M3 21v-3M21 21v-3"/><circle cx="7" cy="10" r="1.5"/></svg>',
  bag:'<svg viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
  coin:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1.4 1.2-2 2.5-2s2.5.7 2.5 2-1 1.7-2.5 2.3-2.5 1-2.5 2.4 1.2 2 2.5 2 2.5-.6 2.5-2"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M4 12l6 6L20 6"/></svg>',
  plane:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M2 12.5l19-9-7 19-3-7.5-7.5-2.5z"/></svg>',
  wave:'<svg viewBox="0 0 24 24"><path d="M2 16.5c1.5-1.5 3-1.5 4.5 0s3 1.5 4.5 0 3-1.5 4.5 0 3 1.5 4.5 0"/><path d="M2 11.5c1.5-1.5 3-1.5 4.5 0s3 1.5 4.5 0 3-1.5 4.5 0 3 1.5 4.5 0"/></svg>',
  cup:'<svg viewBox="0 0 24 24"><path d="M4 8h13v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8z"/><path d="M17 9.5h1.2a2.3 2.3 0 0 1 0 4.6H17"/><path d="M8 3c0 1-1 1-1 2M12 3c0 1-1 1-1 2"/></svg>',
  bridge:'<svg viewBox="0 0 24 24"><path d="M2 16c2.5-4.5 5-6.5 10-6.5s7.5 2 10 6.5"/><path d="M2 16h20M6 16v-3.5M12 16v-6M18 16v-3.5"/></svg>',
  camera:'<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7l1.3-2.5h5.4L16 7"/><circle cx="12" cy="13.5" r="3.3"/></svg>',

/* 依店名/內容自動判斷分類圖示 */
function iconFor(item){
  const s=((item.place||"")+" "+(item.note||"")+(item.n||"")+(item.m||"")+(item.tag||"")).toLowerCase();
  if(item.type==="flight"||s.includes("✈️")||s.includes("jx")||s.includes("機場")) return ICONS.plane;
  if(s.includes("取車")||s.includes("還車")||s.includes("ots")||s.includes("加油")) return ICONS.car;
  if(s.includes("入住")||s.includes("退房")||s.includes("apartment")||s.includes("住一")) return ICONS.bed;
  if(s.includes("燒肉")||s.includes("焼肉")||s.includes("牛排")||s.includes("火神")||s.includes("琉宮苑")) return ICONS.flame;
  if(s.includes("神社")||s.includes("torii")) return ICONS.torii;
  if(s.includes("大橋")||s.includes("橋")) return ICONS.bridge;
  if(s.includes("展望台")||s.includes("観景台")||s.includes("觀景台")||s.includes("牧山")||s.includes("龍宮城")||s.includes("東平安名岬")) return ICONS.camera;
  if(s.includes("水上活動")||s.includes("浮潛")||s.includes("sup")||s.includes("八重干瀬")) return ICONS.snorkel;
  if(s.includes("購物")||s.includes("唐吉訶德")||s.includes("aeon")||s.includes("永旺")||s.includes("大創")||s.includes("補給")) return ICONS.store;
  if(s.includes("海灘")||s.includes("ビーチ")||s.includes("浜")||s.includes("17end")||s.includes("沙灘")) return ICONS.wave;
  if(item.type==="meal") return ICONS.cup;
  return ICONS.pin;
}

/* ============ HELPERS ============ */
const mapURL = q => q.startsWith("http") ? q : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;

function itemHTML(it){
  const cls = ["item", it.type==="meal"?"meal":"", it.type==="flight"?"flight":""].join(" ").trim();
  let cand = "";
  if(it.cand){
    cand = `<div class="candbox"><div class="candlabel">候選清單</div>${it.cand.map(c=>`<div class="cand"><div class="candname"><span class="icon-badge" style="width:20px;height:20px;">${iconFor(c)}</span> ${c.n}</div><div class="candmeta">${c.m}</div>${c.map?`<div class="maprow"><a class="mapbtn" href="${mapURL(c.map)}" target="_blank" rel="noopener">${ICONS.pin}導航</a></div>`:""}</div>`).join("")}</div>`;
  }
  return `<div class="${cls}">
    <div class="dot"></div>
    <div class="card">
      <div class="time">${it.t}</div>
      <div class="place"><span class="icon-badge">${iconFor(it)}</span>${it.place}${it.badge?`<span class="badge">${it.badge}</span>`:""}${it.tag?`<span class="badge">${it.tag}</span>`:""}</div>
      ${it.note?`<div class="note">${it.note}</div>`:""}
      ${it.warn?`<div class="warn">${it.warn}</div>`:""}
      ${it.map?`<div class="maprow"><a class="mapbtn" href="${mapURL(it.map)}" target="_blank" rel="noopener">${ICONS.pin}導航</a></div>`:""}
      ${cand}
    </div>
  </div>`;
}

/* ============ RENDER: ITINERARY ============ */
let activeDay = 1;

function renderRouteSvg(){
  const svg = document.getElementById("routeSvg");
  const coords = [[30,33],[125,15],[220,30],[315,15],[410,21]];
  const old = svg.querySelectorAll(".node");
  old.forEach(n=>n.remove());
  coords.forEach((c,i)=>{
    const g = document.createElementNS("http://www.w3.org/2000/svg","g");
    g.setAttribute("class","node"+(activeDay===i+1?" active":""));
    g.innerHTML = `<circle cx="${c[0]}" cy="${c[1]}" r="6.5"></circle><text x="${c[0]}" y="${c[1]+14}">D${i+1}</text>`;
    g.addEventListener("click",()=>{activeDay=i+1;renderAll();document.getElementById("nav-itinerary").click();});
    svg.appendChild(g);
  });
}

function renderDayPills(){
  const wrap = document.getElementById("dayPills");
  wrap.innerHTML = DAYS.map(d=>`<div class="pill${d.id===activeDay?" active":""}" data-day="${d.id}">${d.label} ${d.date}</div>`).join("");
  wrap.querySelectorAll(".pill").forEach(p=>{
    p.addEventListener("click",()=>{activeDay=parseInt(p.dataset.day);renderAll();});
  });
}

function renderItineraryView(){
  const day = DAYS.find(d=>d.id===activeDay);
  const el = document.getElementById("view-itinerary");
  el.innerHTML = `
    <div class="daytitle">${day.label}｜${day.title}</div>
    <div class="daydate">${day.date}</div>
    <div class="timeline">${day.items.map(itemHTML).join("")}</div>
  `;
}

/* ============ RENDER: TRANSPORT ============ */

    ${TRANSPORT.flights.map(f=>`
      <div class="flightcard">

          <div class="fpoint"><div class="fcode">${f.from.split(" ")[0]}</div><div class="ftime">${f.dep}</div></div>
          <div class="fline"><div class="lbl">${f.meta}</div><div class="bar"></div></div>
          <div class="fpoint"><div class="fcode">${f.to.split(" ")[0]}</div><div class="ftime">${f.arr}</div></div>

    <div class="infocard">

    </div>

}

/* ============ RENDER: PACKING ============ */
function renderPackingView(){

      <div class="checkgroup">

function renderAll(){

  renderDayPills();
  renderItineraryView();

/* ============ NAV ============ */
const NAV_ITEMS = [
  {id:"itinerary",label:"行程",icon:ICONS.cal},
  {id:"transport",label:"交通",icon:ICONS.car},
  {id:"stay",label:"住宿",icon:ICONS.bed},
  {id:"packing",label:"行李",icon:ICONS.bag},
  {id:"budget",label:"預算",icon:ICONS.coin}
];

function renderNav(){
  const nav = document.getElementById("bottomNav");
  nav.innerHTML = NAV_ITEMS.map((n,i)=>`
    <button class="navbtn${i===0?" active":""}" id="nav-${n.id}" data-target="${n.id}">
      ${n.icon}<span>${n.label}</span>
    </button>
  `).join("");
  nav.querySelectorAll(".navbtn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      nav.querySelectorAll(".navbtn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
      document.getElementById("view-"+btn.dataset.target).classList.add("active");
      document.querySelector("main").scrollTo?.(0,0);
      window.scrollTo(0,0);
    });
  });
}

renderNav();
renderAll();
</script>
